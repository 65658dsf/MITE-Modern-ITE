plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'io.github.ningmeng123.modernite'
base { archivesName = 'modern-ite' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
def miteJar = file(providers.gradleProperty('miteJar').getOrElse('../miteto1.21.1neoforge/build/libs/mite-0.1.9.jar'))
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = '21.1.259'
    addModdingDependenciesTo sourceSets.gametest
    runs {
        client {
            client()
            gameDirectory = file('run-client')
            if (providers.gradleProperty('modernIteClientAudit').getOrElse('false').toBoolean()) {
                systemProperty 'modern_ite.clientAudit', 'true'
                systemProperty 'modern_ite.clientAuditOutput', file('build/verification/client-audit.json').absolutePath
            }
            if (providers.gradleProperty('modernIteMobRenderAudit').getOrElse('false').toBoolean()) {
                gameDirectory = file('run-mob-render-audit')
                systemProperty 'modern_ite.mobRenderAudit', 'true'
                systemProperty 'modern_ite.mobRenderAuditOutput', file('build/verification/mob-render-audit.json').absolutePath
            }
        }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'modern_ite'
        }
    }
    mods {
        modern_ite { sourceSet sourceSets.main; sourceSet sourceSets.gametest }
    }
}
// NeoForge 21.1.259 reads this setting from TOML, not a JVM property. Seed only
// this project's dev client directory to avoid its early-display UnionFS crash.
def prepareDevClientWindow = tasks.register('prepareDevClientWindow') {
    doLast {
        def audit = providers.gradleProperty('modernIteMobRenderAudit').getOrElse('false').toBoolean()
        def config = file("${audit ? 'run-mob-render-audit' : 'run-client'}/config/fml.toml")
        config.parentFile.mkdirs()
        def existing = config.exists() ? config.getText('UTF-8') : ''
        def setting = 'earlyWindowControl = false'
        def updated = existing =~ /(?m)^earlyWindowControl\s*=.*$/
        def text = updated.find() ? existing.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, setting) : existing + '\n' + setting + '\n'
        if (existing != text) config.setText(text, 'UTF-8')
    }
}
tasks.named('runClient') { dependsOn prepareDevClientWindow }

dependencies {
    implementation files(miteJar)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
