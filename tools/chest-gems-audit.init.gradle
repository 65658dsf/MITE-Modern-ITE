// Isolated native client and server verification. Author: NingMeng123.
gradle.beforeProject { p ->
    if (p.path == ':') {
        p.layout.buildDirectory.set(p.layout.projectDirectory.dir('build/verification/chest-gems-20261029/build'))
    }
}
gradle.projectsEvaluated {
    def p = rootProject
    def folder = p.providers.gradleProperty('modernIteClientDirectory')
            .getOrElse('build/verification/chest-gems-20261029/client')
    def client = p.extensions.getByName('neoForge').runs.getByName('client')
    client.gameDirectory = p.file(folder)
    client.systemProperty 'modern_ite.mobRenderAudit', 'true'
    client.systemProperty 'modern_ite.chestGemAudit', 'true'
    client.systemProperty 'modern_ite.mobRenderAuditOutput', p.file(folder + '/client-audit.json').absolutePath
    client.programArguments.addAll '--width', '1280', '--height', '900'
    p.tasks.named('prepareDevClientWindow').configure {
        doLast {
            def config = p.file(folder + '/config/fml.toml')
            config.parentFile.mkdirs()
            def prior = config.exists() ? config.getText('UTF-8') : ''
            def result = prior =~ /(?m)^earlyWindowControl\s*=.*$/
            def updated = result.find() ? prior.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
                    : prior + '\nearlyWindowControl = false\n'
            if (prior != updated) config.setText(updated, 'UTF-8')
        }
    }
}
